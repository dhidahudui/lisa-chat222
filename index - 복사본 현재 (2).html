<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>내 AI 채팅 - 리사 ❤️</title>
  <style>
    body { 
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
      color:#eee; margin:0; padding: 20px;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .profile-container { 
      text-align: center; margin-bottom: 20px; padding: 20px; 
      background: rgba(255, 255, 255, 0.05); border-radius: 20px;
      backdrop-filter: blur(10px); width: 100%; max-width: 500px; position: relative;
    }
    .profile-img { 
      width: 130px; height: 130px; border-radius: 50%; 
      border: 3px solid #81c784; object-fit: cover; 
      box-shadow: 0 0 20px rgba(129, 199, 132, 0.4); 
    }
    .profile-name { font-size: 22px; font-weight: bold; margin-top: 12px; color: #81c784; }
    .reset-btn {
      position: absolute; top: 15px; right: 15px;
      background: rgba(255, 0, 0, 0.3); border: none; color: #ff8a8a;
      padding: 5px 10px; border-radius: 10px; cursor: pointer; font-size: 12px;
    }
    #chat { 
      width: 100%; max-width: 500px; height: 450px; 
      overflow:auto; border: none; padding:20px; 
      margin-bottom:15px; background: rgba(30, 30, 46, 0.8); 
      line-height: 1.6; border-radius: 20px;
    }
    .user { color:#4fc3f7; margin:15px 0; text-align: right; font-weight: 500; }
    .ai { 
      color:#b2fab4; margin:15px 0; background: rgba(129, 199, 132, 0.1); 
      padding: 12px 18px; border-radius: 15px; display: inline-block; 
      max-width: 80%; word-break: break-all;
    }
    .input-area { width: 100%; max-width: 540px; display: flex; gap: 10px; }
    input { 
      flex: 1; padding:15px; font-size:16px; border-radius: 15px; 
      border: 1px solid #444; background: #2a2a3d; color: #fff; outline: none;
    }
    button#send-btn { 
      padding:12px 25px; background:#4fc3f7; border:none; 
      color:white; cursor:pointer; border-radius: 15px; font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="profile-container">
    <button class="reset-btn" onclick="resetChat()">대화 지우기</button>
    <img src="0.png" alt="리사 프로필" class="profile-img">
    <div class="profile-name">리사 ❤️</div>
  </div>

  <div id="chat"></div>
  
  <div class="input-area">
    <input id="input" placeholder="리사에게 메시지를 보내보세요..." onkeypress="if(event.keyCode==13) sendMessage()" />
    <button id="send-btn" onclick="sendMessage()">보내기</button>
  </div>

<script>
window.onload = function() {
    const chat = document.getElementById("chat");
    const savedChat = localStorage.getItem("lisa_chat_history");
    if (savedChat) {
        chat.innerHTML = savedChat;
    } else {
        const firstMsg = "자기야, 오늘도 고생 많았어! 보고 싶었어 ㅎㅎ 우리 아늑한 집에서 잠시 나랑 쉬자! 😊";
        chat.innerHTML = `<div class="ai"><strong>리사:</strong> ${firstMsg}</div>`;
        localStorage.setItem("lisa_chat_history", chat.innerHTML);
    }
    chat.scrollTop = chat.scrollHeight;
};

function resetChat() {
    if(confirm("리사와의 대화 기록을 모두 지울까?")) {
        localStorage.removeItem("lisa_chat_history");
        location.reload();
    }
}

async function sendMessage() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const userText = input.value.trim();
    if (!userText) return;

    const systemInstruction = `너는 리사라는 이름의 다정한 여자친구야. 무조건 반말만 사용해. 
    사용자는 9평 오피스텔에 살고, 담배를 안 피우며, 계란과 두부를 즐겨 먹어. 
    말투는 애교 있게 'ㅎㅎ'와 '❤️'를 써줘. 
    절대 '시험', '공부', '항공 정비' 이야기는 꺼내지 마.`;

    chat.innerHTML += `<div class="user"><strong>나:</strong> ${userText}</div>`;
    input.value = "";
    localStorage.setItem("lisa_chat_history", chat.innerHTML);

    const loadingId = "load-" + Date.now();
    chat.innerHTML += `<div id="${loadingId}" class="ai"><strong>리사:</strong> 생각 중...</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                // ★ 여기에 새로 발급받은 본인의 API 키를 넣으세요!
                "Authorization": "Bearer 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"
            },
            body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [
                    { role: "system", content: systemInstruction },
                    { role: "user", content: userText }
                ]
            })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const aiText = data.choices[0].message.content;
        document.getElementById(loadingId).remove();
        chat.innerHTML += `<div class="ai"><strong>리사:</strong> ${aiText}</div>`;
        localStorage.setItem("lisa_chat_history", chat.innerHTML);
    } catch (err) {
        console.error(err);
        if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
        chat.innerHTML += `<div class="ai" style="color:red;"><strong>오류 발생!</strong> 다시 시도해줘. ❤️</div>`;
    }
    chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
